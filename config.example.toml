# config.toml にコピーして編集してください（config.toml は git 管理外）

[browser]
# 自分で起動した Chrome に接続する場合（README 参照）。空ならスクリプトが Chromium を起動する
cdp_url = ""
# スクリプトが起動する場合のプロファイル保存先
profile_dir = "browser-profile"

[watch]
# Turnstile を通過する入口にする施設の申込 id（765 = ブルーベリーヒル勝浦）
entry_apply_id = 765
# Turnstile 通過を待つ最大時間（秒）
captcha_timeout_sec = 600
# 全施設の確認を繰り返す間隔（秒）。遮断を避けるため 180 未満は不可
interval_sec = 300
# 確認を繰り返す回数（1 なら 1 回だけ）
max_rounds = 12
# カレンダーの月を 1 つ読み込むごとの待ち時間（ミリ秒）。2000 未満は不可
request_wait_ms = 3000

[search]
# 泊数（一泊のみ対応）
nights = 1
# 人数（仮予約の段階で使う）
persons = 2
# 対象の曜日（チェックイン日）。並び順が優先順。空なら全曜日
weekdays = ["土", "金", "日"]
# 対象期間（チェックイン日、YYYY-MM-DD）。空なら今日から months_ahead か月先の月末まで
# カレンダーは当月・翌月・翌々月の 3 か月分が公開される（翌々月は通常 27 日に空室公開）
date_from = ""
date_to = ""
months_ahead = 2

[reserve]
# off     仮予約しない（空きの通知のみ）
# dry_run 部屋を選ぶところまで行い「予約手続きに進む」の手前で止める（部屋は確保されない）
# submit  メールアドレス送信まで行う（30 分で失効する仮予約になる。.env の ITS_EMAIL を使う）
mode = "dry_run"
# submit のとき、仮予約の直前にターミナルで y/N の確認をする
confirm = true
# 条件に合う枠のうち、優先順に何件まで試すか（埋まっていたら次へ）
max_attempts = 3

# 対象の施設。上にあるほど優先。名前はカレンダーのタブ表記と同じにする
[[facilities]]
name = "ブルーベリーヒル勝浦"

[[facilities]]
name = "トスラブ館山ルアーナ"
